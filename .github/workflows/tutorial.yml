# Publishes the tutorial (tutorial/) to GitHub Pages (the `gh-pages` branch).
# The R code of the pages is not run here: its results are rendered locally and committed in
# `tutorial/_freeze/` (see tutorial/README.md), so this needs Quarto only.
name: Publish tutorial

on:
  push:
    branches: [main]
    paths: ["tutorial/**", ".github/workflows/tutorial.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25   # As used locally (the reports pin Quarto in the Dockerfile too)
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: tutorial
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
