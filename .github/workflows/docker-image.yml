name: Create and publish a Docker image to hub.docker.com

on:
  push:
    branches:
      - main

jobs:
  build:
    if: github.repository == 'Exposomics-SciLifeLab/quanta'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set date and time as tag
        id: set_tag
        run: echo "TAG=$(TZ="Europe/Stockholm" date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
      - name: Build Docker image
        run: docker build --platform linux/amd64 -t parasitetwin/quanta:$TAG -f Dockerfile .
      - name: Login to Docker Hub
        # The token via stdin, not on the command line
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish to Docker Hub
        run: docker push parasitetwin/quanta:$TAG